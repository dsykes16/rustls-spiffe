name: Tests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
  CARGO_TERM_COLOR: always
jobs:
  sonarqube:
    name: SonarQube
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: spire/build
          key: ${{ runner.os }}-spire-build-${{ hashFiles('spire/Makefile') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: spire/bin
          key: ${{ runner.os }}-spire-bin-${{ hashFiles('spire/Makefile') }}
      - uses: taiki-e/install-action@e75ebe7dbc95b597977d60b8be6b783b732e4d3b # cargo-nextest
      - uses: taiki-e/install-action@7ba3421b00d46a29aaedcfe59124f4574e23e73e # cargo-llvm-cov
      - name: format
        run: cargo fmt --check
      - name: lint
        run: cargo clippy -- -D warnings
      - name: build spire
        run: make -C spire SHELL=/bin/bash
      - name: start spire
        run: make up SHELL=/bin/bash
      - name: test
        run:
          SPIFFE_ENDPOINT_SOCKET=unix:///tmp/spire-agent/public/api.sock
          cargo llvm-cov nextest --profile ci
      - name: doc test
        run:
          SPIFFE_ENDPOINT_SOCKET=unix:///tmp/spire-agent/public/api.sock
          cargo test --doc
      - name: generate coverage report
        run: cargo llvm-cov report --codecov --output-path coverage.json
      - name: upload codecov test report
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: upload codecov coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  deny:
    name: cargo-deny
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@a5adbc370d74d501ea91075eecdb603bec8857bc # cargo-deny
      - name: check advisories, licenses, bans, and sources
        run: cargo deny check
  semver:
    name: cargo-semver-checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@0ae6c22848edca658abfcc689521f6ff1e10357b # cargo-semver-checks
      - name: check semver against latest crates.io release
        run: cargo semver-checks
